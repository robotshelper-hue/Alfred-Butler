<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred — Your Personal Butler</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:       #000000;
      --white:       #FFFFFF;
      --gold:        #FFD700;
      --gold-dim:    #B8960C;
      --cyan:        #00E5FF;
      --red-alert:   #FF4444;
      --surface:     #0A0A0A;
      --border:      #1E1E1E;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ── Scanline overlay for OLED aesthetic ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.015) 2px,
        rgba(255,255,255,0.015) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 0;
    }

    /* ── Crest / Logo ── */
    .crest {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 0 18px var(--gold));
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 14px var(--gold)); }
      50%       { filter: drop-shadow(0 0 28px var(--gold)); }
    }

    /* ── Title ── */
    .title {
      margin-top: 1.4rem;
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow:
        0 0 20px rgba(255,215,0,0.6),
        0 0 40px rgba(255,215,0,0.3);
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      font-style: italic;
    }

    /* ── Divider ── */
    .divider {
      margin: 2.5rem 0;
      width: min(380px, 80vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    /* ── Quote ── */
    .quote {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: rgba(255,255,255,0.65);
      font-style: italic;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── Sign-in card ── */
    .card {
      margin-top: 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      width: min(420px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      box-shadow: 0 0 40px rgba(255,215,0,0.06);
    }

    .card-label {
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    /* ── Google Sign-in button ── */
    .btn-google {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--white);
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      justify-content: center;
    }

    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255,255,255,0.2);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google svg {
      flex-shrink: 0;
    }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,68,68,0.15);
      border: 1px solid var(--red-alert);
      border-radius: 6px;
      color: var(--red-alert);
      font-size: 0.95rem;
      text-align: center;
    }

    .error-banner.visible { display: block; }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="crest" role="img" aria-label="Alfred crest">&#9812;</div>

    <h1 class="title">Alfred</h1>
    <p class="subtitle">Your Personal Butler</p>

    <div class="divider" role="separator"></div>

    <p class="quote">"Good evening, sir Horace. Shall we begin?"</p>

    <div class="card">
      <span class="card-label">Secure Sign-In</span>

      <div id="error-banner" class="error-banner" role="alert"></div>

      <a href="/auth/google" class="btn-google" aria-label="Sign in with Google">
        <!-- Google G logo -->
        <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Sign in with Google
      </a>
    </div>
  </main>

  <footer class="footer">Alfred v1.0 &mdash; Module 1</footer>

  <script>
    // Show error if redirected with ?error=
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err) {
      const messages = {
        access_denied: 'Access was denied. Please try again.',
        auth_failed:   'Authentication failed. Please try again.',
        no_code:       'No authorisation code received. Please try again.',
      };
      const banner = document.getElementById('error-banner');
      banner.textContent = messages[err] || 'An error occurred. Please try again.';
      banner.classList.add('visible');
    }
  </script>
</body>
</html>
